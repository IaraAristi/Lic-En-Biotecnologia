<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<title>Mapa de Correlativas — Licenciatura en Biotecnología (UNAHUR)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
/* Aplica el tema antes de pintar para evitar el destello blanco */
(function(){
  var t = null;
  try { t = localStorage.getItem('biotec-theme'); } catch(e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#F2F4F8; --surface:#FFFFFF; --ink:#10131A; --muted:#566073; --line:#DDE2EC;
    --on-solid:#FFFFFF; --scrim:rgba(16,19,26,.5); --danger:#D6336C; --ok-text:#0A5F54;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0C0F16; --surface:#151A24; --ink:#EEF1F7; --muted:#9AA5B8; --line:#262D3B;
    --on-solid:#0C0F16; --scrim:rgba(0,0,0,.65); --danger:#FF7A9C; --ok-text:#5EEAD4;
  }
  .c-CFC{--c:#52607A; --tint:#E6EAF1; --ct:#3E4A60;}
  .c-CFB{--c:#0B7A6C; --tint:#DDF3EE; --ct:#0A5F54;}
  .c-CFE{--c:#B45309; --tint:#FDEBCB; --ct:#8A3F06;}
  .c-CIC{--c:#4F46E5; --tint:#E6E4FD; --ct:#3C34B8;}
  :root[data-theme="dark"] .c-CFC{--c:#9DB0CC; --tint:#1B2331; --ct:#B9C7DC;}
  :root[data-theme="dark"] .c-CFB{--c:#2DD4BF; --tint:#0F2A29; --ct:#5EEAD4;}
  :root[data-theme="dark"] .c-CFE{--c:#FBBF24; --tint:#2B2210; --ct:#FCD34D;}
  :root[data-theme="dark"] .c-CIC{--c:#9A95FF; --tint:#1E1C46; --ct:#B5B1FF;}

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Manrope',sans-serif; font-size:14px; line-height:1.4; min-height:100vh;}
  button{font:inherit; color:inherit; cursor:pointer;}
  button:focus-visible,input:focus-visible,h2:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .page{max-width:1480px; margin:0 auto; padding-bottom:56px;}

  /* ---------- Barra superior ---------- */
  .top{display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; padding:16px 32px;}
  .brand{display:flex; align-items:center; gap:14px; margin-right:auto; min-width:0;}
  .mark{display:grid; grid-template-columns:repeat(2,1fr); gap:3px; width:40px; height:40px; flex:0 0 40px;}
  .mark i{display:block; border-radius:4px;}
  .mark i:nth-child(1){background:#0B7A6C;} .mark i:nth-child(2){background:#B45309;}
  .mark i:nth-child(3){background:#4F46E5;} .mark i:nth-child(4){background:#52607A;}
  :root[data-theme="dark"] .mark i:nth-child(1){background:#2DD4BF;} :root[data-theme="dark"] .mark i:nth-child(2){background:#FBBF24;}
  :root[data-theme="dark"] .mark i:nth-child(3){background:#9A95FF;} :root[data-theme="dark"] .mark i:nth-child(4){background:#9DB0CC;}
  .brand h1{margin:0; font:800 22px 'Manrope',sans-serif; letter-spacing:-.3px;}
  .brand p{margin:0; font-size:13px; color:var(--muted);}
  .tools{display:flex; align-items:center; gap:8px;}
  .iconbtn{width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center;}
  .iconbtn svg{display:block;}
  :root[data-theme="dark"] .i-moon{display:none;}
  :root[data-theme="light"] .i-sun{display:none;}
  body.editing #menuBtn{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .menuwrap{position:relative;}
  .menu{position:absolute; right:0; top:52px; width:280px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 14px 34px rgba(0,0,0,.2); padding:6px; z-index:20;}
  .menu .cap{font:600 12px 'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:8px 12px 4px;}
  .menu button{display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:0 12px; border:0; border-radius:8px; background:transparent; text-align:left; font-weight:600;}
  .menu button:hover{background:var(--bg);}
  .menu button.danger{color:var(--danger);}
  .menu button[aria-pressed="true"]{background:var(--bg);}
  .msep{height:1px; background:var(--line); margin:4px 6px;}
  .login{height:44px; padding:0 18px; border-radius:12px; border:0; background:var(--ink); color:var(--bg); font-weight:700; display:flex; align-items:center; gap:8px;}
  .acct{height:44px; max-width:280px; padding:0 14px 0 8px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; gap:10px;}
  .avatar{width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; flex:0 0 28px;}
  .acct .who{min-width:0; display:flex; flex-direction:column;}
  .acct b{font-size:13px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .acct .sync{font:600 12px 'JetBrains Mono',monospace; color:var(--ok-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .acct .sync.error{color:var(--danger);}

  .notice{margin:0 32px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:10px 16px; border-radius:12px; background:var(--surface); border:1px dashed var(--muted); font-size:13px;}
  .notice button{min-height:36px; padding:0 4px; border:0; background:transparent; font-weight:700; text-decoration:underline;}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); max-width:calc(100% - 32px); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.25);}

  /* ---------- Contenido ---------- */
  .wrap{padding:20px 32px 0; display:flex; flex-direction:column; gap:20px;}
  .savebar{font:600 12px 'JetBrains Mono',monospace; color:var(--muted); text-align:right; margin-bottom:-8px;}
  .savebar:empty{display:none;}
  .savebar.ok{color:var(--ok-text);}
  .savebar.error{color:var(--danger);}

  .sum{display:flex; flex-wrap:wrap; gap:12px;}
  .big{flex:1 1 230px; background:var(--ink); color:var(--bg); border-radius:16px; padding:16px 20px; display:flex; flex-direction:column; justify-content:space-between; gap:6px; min-height:104px;}
  .big .k{font:600 12px 'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.06em; opacity:.85;}
  .big .n{font:800 44px/1 'Manrope',sans-serif; letter-spacing:-1px;}
  .big .s{font:500 13px 'JetBrains Mono',monospace; opacity:.9;}
  .cfs{flex:4 1 560px; min-width:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px;}
  .cf{background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:14px 16px; text-align:left; display:flex; flex-direction:column; gap:6px; min-height:104px;}
  .cf .lbl{display:flex; align-items:flex-start; gap:8px; font-weight:700; font-size:14px; line-height:1.25;}
  .cf .lbl::before{content:''; flex:0 0 12px; height:12px; margin-top:3px; border-radius:4px; background:var(--c);}
  .cf .nums{font:600 13px 'JetBrains Mono',monospace; color:var(--muted);}
  .cf[aria-pressed="true"]{border-color:var(--ink);}
  .cf .bar{height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:auto;}
  .cf .bar span{display:block; height:100%; background:var(--c); border-radius:4px;}
  .cf.acacard{--c:var(--ink); border-style:dashed;}

  /* Filtro por estado */
  .flt{display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .flt .lab{font:700 12px 'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-right:4px;}
  .fbtn{min-height:44px; padding:0 14px; border-radius:999px; border:2px solid var(--line); background:var(--surface); display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px;}
  .fbtn .cnt{font:700 12px 'JetBrains Mono',monospace; color:var(--muted);}
  .fbtn[aria-pressed="true"]{border-color:var(--ink);}
  .sw{display:inline-block; width:16px; height:16px; border-radius:5px; flex:0 0 16px;}
  .sw.todas{background:conic-gradient(#0B7A6C 0 25%,#B45309 0 50%,#4F46E5 0 75%,#52607A 0);}
  .sw.ap{background:var(--ink);}
  .sw.fin{border:2px dashed var(--ink); background:var(--surface);}
  .sw.libre{border:2px solid var(--ink); background:var(--surface);}
  .sw.bloq{border:2px dotted var(--muted); background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px);}

  /* Panel de detalle (solo con una materia elegida) */
  .detail{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 22px; min-height:150px; display:flex; flex-wrap:wrap; gap:16px 32px; align-items:flex-start;}
  body.editing .detail{border:2px dashed var(--ink);}
  .d-main{flex:1 1 340px; min-width:0; display:flex; flex-direction:column; gap:10px;}
  .d-code{font:600 12px 'JetBrains Mono',monospace; color:var(--muted);}
  .d-main h2{margin:0; font:800 24px/1.15 'Manrope',sans-serif; letter-spacing:-.4px;}
  .d-pill{align-self:flex-start; display:inline-flex; padding:4px 10px; border-radius:8px; background:var(--tint); color:var(--ct); font:700 12px 'JetBrains Mono',monospace;}
  .sb3{display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; align-self:flex-start;}
  .sb3 button{min-height:44px; padding:0 16px; border:0; border-right:1px solid var(--line); background:transparent; font-weight:700; font-size:13px;}
  .sb3 button:last-child{border-right:0;}
  .sb3 button[aria-pressed="true"]{background:var(--ink); color:var(--bg);}
  .av{display:flex; flex-direction:column; gap:6px; padding:12px 14px; border-radius:12px; border:2px solid var(--ink);}
  .av .avt{display:flex; align-items:center; gap:8px; font:800 15px 'Manrope',sans-serif;}
  .av .avd{font-size:13px; color:var(--muted);}
  .av.libre{background:var(--ink); color:var(--bg);}
  .av.libre .avd{color:var(--bg); opacity:.85;}
  .av.bloq{border-style:dotted; border-color:var(--muted); background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);}
  .av.ap{border-color:var(--ok-text); color:var(--ok-text);}
  .av.fin{border-style:dashed;}
  .segs{display:flex; gap:4px;}
  .segs i{display:block; flex:1; height:8px; border-radius:4px; background:var(--line); max-width:44px;}
  .segs i.on{background:var(--ink);}
  .d-rel{flex:1 1 440px; min-width:0; display:flex; flex-wrap:wrap; gap:14px 24px;}
  .rel-col{flex:1 1 200px; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .rel-col h3{margin:0; font:700 12px 'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
  .rchip{display:flex; align-items:center; gap:10px; min-height:52px; min-width:0; padding:6px 12px; border-radius:12px; border:2px solid var(--c); background:var(--tint); text-align:left; overflow-wrap:anywhere; hyphens:auto; -webkit-hyphens:auto;}
  .rchip .rn{flex:0 0 auto; font:700 13px 'JetBrains Mono',monospace; color:var(--ct);}
  .rchip .rtxt{display:flex; flex-direction:column; min-width:0;}
  .rchip .rname{font-weight:700; font-size:13px; line-height:1.25;}
  .rchip .rst{font:700 12px 'JetBrains Mono',monospace; color:var(--muted);}
  .rchip.miss{background:var(--surface); border:2px dashed var(--ink);}
  .rchip.miss .rst{color:var(--ink);}
  .rchip.free{background:var(--surface); border:2px solid var(--ink);}
  .rchip.free .rst{color:var(--ok-text);}
  .rchip.wait{background:var(--surface); border:2px dotted var(--muted);}
  .d-empty{font-size:14px; color:var(--muted); align-self:center; max-width:760px;}
  .d-empty .t{display:block; color:var(--ink); font:800 18px 'Manrope',sans-serif; margin-bottom:4px;}
  .d-empty b{color:var(--ink);}
  .none{font-size:13px; color:var(--muted); font-style:italic;}
  .btn{min-height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--bg); font-weight:700;}
  .btn.primary{background:var(--ink); border-color:var(--ink); color:var(--bg);}
  .btn.google{border:2px solid var(--ink);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* ---------- Filas por año ---------- */
  .row{display:flex; flex-wrap:wrap; gap:12px 20px; padding-top:4px;}
  .row-h{flex:0 0 120px; display:flex; flex-direction:column; gap:6px; padding-top:2px;}
  .yr{font:800 24px 'JetBrains Mono',monospace; letter-spacing:-.5px;}
  .yf{font:600 12px 'JetBrains Mono',monospace; color:var(--muted);}
  .rowbar{height:6px; border-radius:3px; background:var(--line); overflow:hidden;}
  .rowbar span{display:block; height:100%; background:var(--ink); border-radius:3px;}
  .row-g{flex:1 1 640px; min-width:0; display:flex; flex-wrap:wrap; gap:16px 24px;}
  .grp{flex:1 1 380px; min-width:0;}
  .grp h3{margin:0 0 8px; font:600 12px 'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px;}
  .tile{position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:6px; min-height:128px; min-width:0; padding:10px; text-align:left; border-radius:14px; border:2px solid transparent; background:var(--tint); color:var(--ink);}
  .tile .top2{display:flex; align-items:center; justify-content:space-between; gap:4px;}
  .tile .num{font:800 20px 'JetBrains Mono',monospace; color:var(--ct);}
  .tile .ic{display:flex; color:var(--ct);}
  .tile .ic svg{display:none;}
  .tile.ap .ic .b-ap,.tile.fin .ic .b-fin,.tile.libre .ic .b-libre,.tile.bloq .ic .b-bloq{display:block;}
  .tile .tag{font:700 11px 'JetBrains Mono',monospace; color:var(--muted); margin-top:-2px;}
  .tile .nm{font:700 12.5px/1.25 'Manrope',sans-serif; min-width:0; max-width:100%; hyphens:auto; -webkit-hyphens:auto; overflow-wrap:anywhere;}
  .tile.ap{background:var(--c); color:var(--on-solid);}
  .tile.ap .num,.tile.ap .tag,.tile.ap .ic{color:var(--on-solid);}
  .tile.fin{background:var(--surface); border:2px dashed var(--c);}
  .tile.libre{border:2px solid var(--c);}
  .tile.libre .tag{color:var(--ct);}
  .tile.bloq{background:var(--surface) repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px); border:2px dotted var(--muted); color:var(--muted);}
  .tile.bloq .num,.tile.bloq .ic{color:var(--muted);}
  .tile.prev{border:2px dashed var(--ink);}
  .tile.unl{border:2px solid var(--ink);}
  .tile.frees{border:2px solid var(--ink); box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink);}
  .tile.frees .tag{color:var(--ink);}
  .tile.sel{outline:4px solid var(--ink); outline-offset:2px;}
  .tile.pending{outline:4px dashed var(--ink); outline-offset:2px;}
  .tile.dim{opacity:.28;}
  @media (prefers-reduced-motion:no-preference){ .tile{transition:opacity .15s;} }

  /* ---------- Flexible (ACA) ---------- */
  .acabox{border:2px solid var(--line); border-radius:14px; background:var(--surface); padding:14px; display:flex; flex-direction:column; gap:12px;}
  .aca-h b{display:block; font:800 16px 'Manrope',sans-serif; margin-bottom:2px;}
  .aca-h span{font-size:13px; color:var(--muted);}
  .aca-n{font:800 30px/1.1 'JetBrains Mono',monospace;}
  .aca-n small{font:600 13px 'JetBrains Mono',monospace; color:var(--muted);}
  .bar2{height:10px; border-radius:5px; background:var(--line); overflow:hidden; margin:6px 0 4px;}
  .bar2 span{display:block; height:100%; background:var(--ink); border-radius:5px;}
  .aca-s{font:600 12px 'JetBrains Mono',monospace; color:var(--muted);}
  .aca-list{display:flex; flex-direction:column; gap:6px;}
  .aca-item{display:flex; align-items:center; gap:10px; min-height:52px; padding:4px 4px 4px 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg);}
  .aca-nm{flex:1; min-width:0; font-weight:700; font-size:13px; overflow-wrap:anywhere;}
  .aca-cr{flex:0 0 auto; padding:4px 8px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font:700 12px 'JetBrains Mono',monospace;}
  .aca-del{width:44px; height:44px; flex:0 0 44px; border:0; background:transparent; display:grid; place-items:center; color:var(--muted); border-radius:10px;}
  .aca-del:hover{color:var(--danger);}
  .aca-add{min-height:44px; border:2px dashed var(--ink); border-radius:12px; background:transparent; font-weight:800;}
  .aca-form{display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:12px; background:var(--bg);}
  .aca-form label,.aca-form .lbl2{font-size:12px; font-weight:700; color:var(--muted);}
  .aca-form input{height:44px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit;}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font:800 20px 'JetBrains Mono',monospace;}
  .step-n{min-width:36px; text-align:center; font:800 20px 'JetBrains Mono',monospace;}

  /* ---------- Modal de cuenta ---------- */
  .overlay{position:fixed; inset:0; background:var(--scrim); display:none; align-items:flex-start; justify-content:center; padding:96px 16px 16px; z-index:100; overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{position:relative; width:100%; max-width:380px; background:var(--surface); border-radius:18px; box-shadow:0 16px 48px rgba(0,0,0,.3); padding:24px; display:flex; flex-direction:column; gap:8px;}
  .modal h2{margin:0; font:800 19px 'Manrope',sans-serif; padding-right:36px;}
  .modal p{margin:0 0 8px; font-size:13px; color:var(--muted);}
  .modal .x{position:absolute; top:10px; right:10px; width:44px; height:44px; border:0; background:transparent; display:grid; place-items:center; color:var(--muted);}
  .modal label{font-size:12px; font-weight:700; color:var(--muted);}
  .modal input{height:44px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit;}
  .sep{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); margin:6px 0;}
  .sep::before,.sep::after{content:''; flex:1; height:1px; background:var(--line);}
  .mrow{display:flex; gap:8px; margin-top:6px;}
  .mrow .btn{flex:1;}
  .linkbtn{min-height:44px; border:0; background:transparent; text-decoration:underline; color:var(--muted); font-size:13px;}
  .msg{font-size:12px; min-height:16px; color:var(--muted);}
  .msg.error{color:var(--danger);}
  .msg.ok{color:var(--ok-text);}

  @media (max-width:640px){
    .top{padding:14px 16px;} .wrap{padding:16px 16px 0;} .notice{margin:0 16px;}
    .brand h1{font-size:19px;}
  }
</style>
</head>
<body>
<div class="page">

<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div>
      <h1>Correlativas · Biotecnología</h1>
      <p>UNAHUR · Plan 2025</p>
    </div>
  </div>

  <div class="tools">
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Cambiar a modo oscuro">
      <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <div class="menuwrap">
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Más acciones" aria-haspopup="true" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
      <div class="menu" id="menu" hidden>
        <div class="cap">Acciones</div>
        <button type="button" id="editToggle" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>

        </button>

  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">

    </button>
    <h2 id="authTitle">Guardá tu progreso en la nube</h2>
    <p>Con tu cuenta vas a ver tus materias aprobadas y tus correlativas desde cualquier dispositivo.</p>
    <button class="btn google" id="authGoogle" type="button">Continuar con Google</button>

<script>
const CAMPOS = { CFC:'Formación Común', CFB:'Formación Básica', CFE:'Formación Específica', CIC:'Integración Curricular' };
const ACA_GOAL = 30;

// id, nombre, año-cuatrimestre, campo, créditos (los créditos de las materias no se muestran: el progreso se cuenta en materias)
const subjects = [
  [1,'Introducción a la Biotecnología','1-1','CFE',5],[2,'Matemática I','1-1','CFB',6],[3,'Biología General','1-1','CFB',7],
  [4,'Introducción a la Química','1-1','CFB',6],[5,'Cultura y alfabetización digital','1-1','CFC',4],
  [6,'Química General e Inorgánica','1-2','CFB',6],[7,'Laboratorio de Análisis Ambiental','1-2','CIC',5],[8,'Matemática II','1-2','CFB',6],
  [9,'Higiene y Seguridad','1-2','CFE',3],[10,'Gestión de la Calidad','1-2','CFE',6],
  [11,'Microbiología General','2-1','CFE',7],[12,'Química Orgánica','2-1','CFB',7],[13,'Física','2-1','CFB',6],[14,'Matemática III','2-1','CFB',7],
  [15,'Lab. de Análisis de Alimentos, Medicamentos y Cosméticos','2-2','CIC',5],[16,'Física Aplicada','2-2','CFE',5],
  [17,'Laboratorio de Producción Vegetal','2-2','CFE',5],[18,'Introducción a la Biología Celular y Molecular','2-2','CFE',6],
  [19,'Laboratorio de Química Instrumental y Analítica','2-2','CFE',6],
  [20,'Fisicoquímica','3-1','CFB',6],[21,'Lab. de Técnicas Inmunológicas y de Biología Molecular','3-1','CFE',5],
  [22,'Laboratorio de Análisis Clínicos','3-1','CIC',5],[23,'Bioquímica I','3-1','CFE',7],[24,'Asignatura UNAHUR','3-1','CFC',3],
  [25,'Genética Molecular','3-2','CFE',7],[26,'Economía de la Innovación','3-2','CIC',6],[27,'Estadística y Diseño Experimental','3-2','CFB',6],
  [28,'Bioética y Responsabilidad Profesional','3-2','CFB',3],[29,'Biotecnología Médica e Inmunología','3-2','CFE',7],
  [30,'Ingeniería Genética','4-1','CFE',7],[31,'Formulación y Evaluación de Proyectos','4-1','CIC',6],
  [32,'Biología Molecular y Celular','4-1','CFE',7],[33,'Bioinformática','4-1','CFE',6],
  [34,'Bioquímica II','4-2','CFE',7],[35,'Biotecnología Animal','4-2','CFE',6],[36,'Sociología de la Ciencia y la Tecnología','4-2','CIC',6],
  [37,'Bioprocesos','4-2','CFE',7],
  [38,'Procesos Biotecnológicos Industriales','5-1','CFE',7],[39,'Biotecnología Ambiental','5-1','CFE',6],
  [40,'Agrobiotecnología','5-1','CFE',6],[41,'Biotecnología de Alimentos y Medicamentos','5-1','CFE',6]
].map(a => ({id:a[0], name:a[1], col:a[2], campo:a[3], cred:a[4]}));

const COLS = ['1-1','1-2','2-1','2-2','3-1','3-2','4-1','4-2','5-1'];

const DRAFT_EDGES = [
 [4,6],[4,7],[2,8],[1,9],[1,10],
 [3,11],[7,11],[9,11],
 [6,12],[9,12],
 [8,13],[8,14],
 [10,15],[11,15],
 [13,16],
 [11,17],
 [13,18],[12,18],
 [6,19],
 [6,20],[14,20],
 [11,21],[16,21],
 [19,22],
 [12,23],[19,23],
 [22,25],
 [14,26],[14,27],
 [22,28],
 [21,29],
 [25,30],
 [26,31],
 [29,32],
 [25,33],
 [23,34],
 [32,35],
 [31,36],
 [32,37],
 [37,38],[37,39],
 [32,40],
 [34,41]
];

let edges = DRAFT_EDGES.map(e => e.slice());
let editMode = false;
let editHint = '';
let pendingFrom = null;
let selectedId = null;
let campoFilter = '';
let stateFilter = '';
let status = {}; // id -> 'aprobada' | 'final'   (una materia en final cuenta como aprobada)
let aca = [];    // actividades flexibles: [{id, name, cred}]
let acaFormOpen = false;
const acaDraft = {name:'', cred:2};

const byId = {}; subjects.forEach(s => byId[s.id] = s);
const colIndex = {}; COLS.forEach((c,i) => colIndex[c] = i);
const $ = id => document.getElementById(id);
const pad = id => String(id).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yearOf = s => Number(s.col[0]);
const cuatOf = s => Number(s.col[2]);

const ICONS = {
  ap:'<path d="M20 6 9 17l-5-5"/>',
  fin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  libre:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
  bloq:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
};
const icon = (k, size, sw, cls) => `<svg ${cls ? `class="${cls}" ` : ''}width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;

/* ---------- Relaciones y estados derivados ---------- */
const reqsOf = id => edges.filter(e => e[1]===id).map(e => e[0]);
const unlOf  = id => edges.filter(e => e[0]===id).map(e => e[1]);
// previas que todavía no cuentan: ni aprobadas ni en final
const missingOf = id => reqsOf(id).filter(r => !status[r]);
// ap = aprobada · fin = en final · libre = habilitada para cursar · bloq = bloqueada
function kindOf(id){
  if(status[id]==='aprobada') return 'ap';
  if(status[id]==='final') return 'fin';
  return missingOf(id).length===0 ? 'libre' : 'bloq';
}

/* ---------- Construcción del tablero (una sola vez) ---------- */
function tileHtml(s){
  return `<button class="tile c-${s.campo}" type="button" data-id="${s.id}">
    <span class="top2">
      <span class="num">${pad(s.id)}</span>
      <span class="ic">${['ap','fin','libre','bloq'].map(k => icon(k, 18, 2.8, 'b-'+k)).join('')}</span>
    </span>
    <span class="tag"></span>
    <span class="nm">${esc(s.name)}</span>
  </button>`;
}

function buildBoard(){
  let html = '';
  for(let y=1; y<=5; y++){
    html += `<section class="row" aria-labelledby="yr${y}">
      <div class="row-h"><span class="yr" id="yr${y}">AÑO ${y}</span><span class="yf" data-yf="${y}"></span><div class="rowbar"><span data-yb="${y}" style="width:0%"></span></div></div>
      <div class="row-g">`;
    [1,2].forEach(c => {
      const items = subjects.filter(s => s.col === y+'-'+c);
      if(!items.length) return;
      html += `<div class="grp"><h3>Cuatrimestre ${c}</h3><div class="tiles">${items.map(tileHtml).join('')}</div></div>`;
    });
    if(y === 5){
      html += `<div class="grp"><h3>Flexible</h3><div class="acabox" id="acaBox"></div></div>`;
    }
    html += '</div></section>';
  }
  $('board').innerHTML = html;

  $('cfs').innerHTML = ['CFC','CFB','CFE','CIC'].map(k =>
    `<button class="cf c-${k}" type="button" data-campo="${k}" aria-pressed="false">
      <span class="lbl">${CAMPOS[k]}</span><span class="nums"></span>
      <div class="bar"><span style="width:0%"></span></div>
    </button>`).join('') +
    `<div class="cf acacard"><span class="lbl">Flexible (ACA)</span><span class="nums" id="acaCardNums"></span><div class="bar"><span id="acaCardBar" style="width:0%"></span></div></div>`;
}

/* ---------- Actualización de la vista ---------- */
function stateText(k, falt){
  return k==='ap' ? 'aprobada' : k==='fin' ? 'en final' : k==='libre' ? 'habilitada para cursar' : `bloqueada, faltan ${falt} previas`;
}

function update(){
  const base = editMode ? pendingFrom : selectedId;
  const reqs = base!==null ? reqsOf(base) : [];
  const unl = base!==null ? unlOf(base) : [];
  const baseDone = base!==null && !!status[base];
  // materias que quedan libres al aprobar la elegida (solo si todavía no cuenta como aprobada)
  const freed = (!editMode && base!==null && !baseDone)
    ? unl.filter(u => !status[u] && missingOf(u).filter(r => r!==base).length===0)
    : [];

  document.querySelectorAll('.tile').forEach(t => {
    const id = Number(t.dataset.id), s = byId[id], k = kindOf(id);
    const isSel = id===base, isReq = reqs.includes(id), isUnl = unl.includes(id), isFreed = freed.includes(id);
    let cls = 'tile c-' + s.campo + ' ' + k;
    if(isSel) cls += editMode ? ' pending' : ' sel';
    else if(isReq) cls += ' prev';
    else if(isFreed) cls += ' frees';
    else if(isUnl) cls += ' unl';
    const related = isSel || isReq || isUnl;
    if((!editMode && base!==null && !related) || (campoFilter && s.campo!==campoFilter) || (stateFilter && stateFilter!==k)) cls += ' dim';
    t.className = cls;
    const falt = missingOf(id).length;
    t.querySelector('.tag').textContent =
      isSel ? (editMode ? 'ORIGEN' : 'ELEGIDA') :
      isReq ? 'PREVIA' : isFreed ? 'SE LIBERA' : isUnl ? 'HABILITA' :
      k==='libre' ? 'LIBRE' : k==='bloq' ? 'FALTAN ' + falt : s.campo;
    t.setAttribute('aria-pressed', String(isSel));
    t.setAttribute('aria-label', `${s.name}, ${CAMPOS[s.campo]}, ${stateText(k, falt)}`);
  });
  updateProgress();
  renderDetail(freed);
}

function updateProgress(){
  const total = subjects.length;
  const kinds = {};
  subjects.forEach(s => kinds[s.id] = kindOf(s.id));
  const count = k => subjects.filter(s => kinds[s.id]===k).length;
  const done = count('ap') + count('fin'); // una materia en final cuenta como aprobada
  $('bigPct').textContent = Math.round(done/total*100) + '%';
  $('bigSub').textContent = `${done} de ${total} materias · ${count('libre')} habilitadas para cursar`;

  document.querySelectorAll('.cf[data-campo]').forEach(b => {
    const k = b.dataset.campo;
    const items = subjects.filter(s => s.campo===k);
    const d = items.filter(s => status[s.id]).length;
    b.querySelector('.nums').textContent = `${d} / ${items.length} materias`;
    b.querySelector('.bar span').style.width = (items.length ? Math.round(d/items.length*100) : 0) + '%';
    b.setAttribute('aria-pressed', String(campoFilter===k));
  });

  for(let y=1; y<=5; y++){
    const items = subjects.filter(s => yearOf(s)===y);
    const d = items.filter(s => status[s.id]).length;
    const yf = document.querySelector(`[data-yf="${y}"]`), yb = document.querySelector(`[data-yb="${y}"]`);
    if(yf) yf.textContent = `${d}/${items.length} aprobadas`;
    if(yb) yb.style.width = Math.round(d/items.length*100) + '%';
  }

  document.querySelectorAll('#flt .fbtn').forEach(b => {
    const k = b.dataset.state;
    b.setAttribute('aria-pressed', String(stateFilter===k));
    b.querySelector('.cnt').textContent = k==='' ? total : count(k);
  });

  const acaTotal = aca.reduce((a,x) => a + x.cred, 0);
  $('acaCardNums').textContent = `${acaTotal} / ${ACA_GOAL} créditos`;
  $('acaCardBar').style.width = Math.min(100, Math.round(acaTotal/ACA_GOAL*100)) + '%';
}

/* ---------- Panel de detalle ---------- */
function chipHtml(id, cls, stText){
  const s = byId[id];
  return `<button type="button" class="${cls}" data-act="go" data-id="${id}">
    <span class="rn">${pad(id)}</span>
    <span class="rtxt"><span class="rname">${esc(s.name)}</span><span class="rst">${esc(stText)}</span></span>
  </button>`;
}

function renderDetail(freed){
  const el = $('detail');
  const ae = document.activeElement;
  const fk = (ae && ae.dataset && el.contains(ae)) ? ae.dataset.fk : null;
  let html;
  if(editMode){
    html = `<div class="d-empty"><span class="t">Modo edición activo</span>${editHint || 'Elegí dos materias para crear o quitar una conexión entre ellas.'}
      <div style="margin-top:12px"><button type="button" class="btn" data-act="exitEdit" data-fk="exit">Salir del modo edición</button></div></div>`;
  } else if(selectedId===null){
    html = null; // sin selección, el panel de detalle no se muestra
  } else {
    const id = selectedId, s = byId[id], st = status[id] || '', k = kindOf(id);
    const rq = reqsOf(id), ul = unlOf(id), miss = missingOf(id).length;
    const selDone = !!st;
    let avTitle, avText;
    if(k==='ap'){ avTitle = 'Aprobada'; avText = 'Ya cuenta para las materias que la tienen como previa.'; }
    else if(k==='fin'){ avTitle = 'En final'; avText = 'Cuenta como aprobada: ya libera las materias que dependen de ella.'; }
    else if(k==='libre'){ avTitle = 'Habilitada'; avText = rq.length ? 'Tenés todas las previas aprobadas. Ya podés cursarla.' : 'No tiene previas. Podés cursarla desde el inicio.'; }
    else { avTitle = 'Bloqueada'; avText = `Te ${miss===1 ? 'falta 1 previa' : 'faltan ' + miss + ' previas'} por aprobar (${rq.length - miss} de ${rq.length} listas).`; }
    const segs = k==='bloq' ? `<span class="segs" aria-hidden="true">${rq.map(r => `<i class="${status[r] ? 'on' : ''}"></i>`).join('')}</span>` : '';

    const reqChips = rq.map(r => {
      const sr = status[r];
      return chipHtml(r, 'rchip c-' + byId[r].campo + (sr ? '' : ' miss'),
        sr==='aprobada' ? '✓ Aprobada' : sr==='final' ? '✓ En final: ya cuenta como aprobada' : 'Falta aprobarla');
    }).join('');

    const unlChips = ul.map(u => {
      const ku = kindOf(u);
      let cls = 'rchip c-' + byId[u].campo, txt;
      if(!selDone && freed && freed.includes(u)){ cls += ' free'; txt = 'Se libera al aprobar'; }
      else if(!selDone && !status[u]){
        const others = missingOf(u).filter(r => r!==id).length;
        cls += ' wait'; txt = `Aún le ${others===1 ? 'falta 1 previa más' : 'faltan ' + others + ' previas más'}`;
      }
      else if(ku==='ap') txt = '✓ Aprobada';
      else if(ku==='fin') txt = 'En final';
      else if(ku==='libre'){ cls += ' free'; txt = 'Habilitada'; }
      else { cls += ' wait'; txt = `Bloqueada: faltan ${missingOf(u).length}`; }
      return chipHtml(u, cls, txt);
    }).join('');

    const sb = (v, label) => `<button type="button" data-act="status" data-v="${v}" data-fk="st-${v||'p'}" aria-pressed="${st===v}">${label}</button>`;
    html = `<div class="d-main">
        <span class="d-code">UC-${pad(s.id)} · Año ${yearOf(s)} · Cuat. ${cuatOf(s)}</span>
        <h2 tabindex="-1">${esc(s.name)}</h2>
        <span class="d-pill c-${s.campo}">${CAMPOS[s.campo]}</span>
        <div class="av ${k}">
          <span class="avt">${icon(k, 18, 2.4)}${avTitle}</span>
          <span class="avd">${avText}</span>
          ${segs}
        </div>
        <div class="sb3" role="group" aria-label="Estado de la materia">${sb('', 'Pendiente')}${sb('final', 'En final')}${sb('aprobada', 'Aprobada')}</div>
      </div>
      <div class="d-rel">
        <div class="rel-col"><h3>Requiere</h3>${reqChips || '<span class="none">Sin previas: se puede cursar desde el inicio.</span>'}</div>
        <div class="rel-col"><h3>${selDone ? 'Habilita' : 'Al aprobarla se liberan'}</h3>${unlChips || '<span class="none">No habilita otras materias.</span>'}</div>
      </div>`;
  }
  el.hidden = (html === null);
  el.innerHTML = html === null ? '' : html;
  if(fk){ const n = el.querySelector(`[data-fk="${fk}"]`); if(n) n.focus(); }
}

/* ---------- Flexible (ACA) ---------- */
function renderAca(){
  const box = $('acaBox');
  if(!box) return;
  const ae = document.activeElement;
  const fk = (ae && ae.dataset && box.contains(ae)) ? ae.dataset.fk : null;
  const total = aca.reduce((a,x) => a + x.cred, 0);
  const pct = Math.min(100, Math.round(total/ACA_GOAL*100));
  const statusTxt = total >= ACA_GOAL ? `Completaste los ${ACA_GOAL} créditos` : `Te faltan ${ACA_GOAL - total} créditos`;
  const items = aca.map(x => `<div class="aca-item">
      <span class="aca-nm">${esc(x.name)}</span><span class="aca-cr">${x.cred} créd.</span>
      <button type="button" class="aca-del" data-aca="del" data-id="${x.id}" data-fk="del${x.id}" aria-label="Quitar ${esc(x.name)}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      </button></div>`).join('');
  const form = acaFormOpen
    ? `<div class="aca-form">
        <label for="acaName">Nombre de la actividad</label>
        <input id="acaName" type="text" maxlength="120" placeholder="Ej.: Curso de inglés técnico" value="${esc(acaDraft.name)}" data-fk="acaName">
        <span class="lbl2" id="acaCredLbl">Créditos</span>
        <div class="stepper" role="group" aria-labelledby="acaCredLbl">
          <button type="button" data-aca="dec" data-fk="dec" aria-label="Restar un crédito">−</button>
          <span class="step-n" aria-live="polite">${acaDraft.cred}</span>
          <button type="button" data-aca="inc" data-fk="inc" aria-label="Sumar un crédito">+</button>
        </div>
        <div class="mrow">
          <button type="button" class="btn primary" id="acaSave" data-aca="save" data-fk="save" ${acaDraft.name.trim() ? '' : 'disabled'}>Guardar actividad</button>
          <button type="button" class="btn" data-aca="cancel" data-fk="cancel">Cancelar</button>
        </div>
      </div>`
    : `<button type="button" class="aca-add" data-aca="open" data-fk="acaopen">+ Registrar actividad</button>`;
  box.innerHTML = `
    <div class="aca-h"><b>ACA · Actividades Curriculares Acreditables</b><span>Sin correlatividad: se acreditan a elección a lo largo de la carrera. Registrá acá cada una y sumá sus créditos.</span></div>
    <div class="aca-prog"><span class="aca-n">${total}<small> / ${ACA_GOAL} créditos</small></span><div class="bar2"><span style="width:${pct}%"></span></div><span class="aca-s">${statusTxt}</span></div>
    <div class="aca-list">${items || '<span class="none">Todavía no registraste actividades.</span>'}</div>
    ${form}`;
  if(fk){ const n = box.querySelector(`[data-fk="${fk}"]`); if(n) n.focus(); }
}

function resetAcaDraft(){ acaDraft.name = ''; acaDraft.cred = 2; }

function handleAca(btn){
  const act = btn.dataset.aca;
  if(act==='open'){
    acaFormOpen = true; renderAca();
    const i = $('acaName'); if(i) i.focus();
  } else if(act==='cancel'){
    acaFormOpen = false; resetAcaDraft(); renderAca();
  } else if(act==='inc'){
    acaDraft.cred = Math.min(ACA_GOAL, acaDraft.cred + 1); renderAca();
  } else if(act==='dec'){
    acaDraft.cred = Math.max(1, acaDraft.cred - 1); renderAca();
  } else if(act==='save'){
    saveAca();
  } else if(act==='del'){
    const id = Number(btn.dataset.id);
    aca = aca.filter(x => x.id!==id);
    renderAca(); updateProgress(); saveState();
    toast('Actividad quitada.');
  }
}

function saveAca(){
  const name = acaDraft.name.trim();
  if(!name) return;
  const id = aca.reduce((m,x) => Math.max(m, x.id), 0) + 1;
  aca.push({id, name, cred: acaDraft.cred});
  acaFormOpen = false; resetAcaDraft();
  renderAca(); updateProgress(); saveState();
  toast('Actividad registrada.');
  const b = document.querySelector('[data-fk="acaopen"]'); if(b) b.focus();
}

function sanitizeAca(list){
  if(!Array.isArray(list)) return [];
  return list
    .filter(x => x && typeof x.name==='string' && x.name.trim() && Number.isFinite(Number(x.cred)) && Number(x.cred) > 0)
    .map((x,i) => ({id: Number.isFinite(Number(x.id)) ? Number(x.id) : i+1, name: x.name.trim(), cred: Number(x.cred)}));
}

/* ---------- Interacción ---------- */
function setEditHint(html){ editHint = html; }

function onTileClick(id){
  if(editMode){
    if(pendingFrom===null){
      pendingFrom = id;
      setEditHint(`Elegiste <b>${esc(byId[id].name)}</b>. Ahora tocá la materia relacionada (se conectará de la más temprana a la más tardía).`);
      update(); return;
    }
    if(pendingFrom===id){
      pendingFrom = null;
      setEditHint('Selección cancelada. Elegí dos materias para conectar.');
      update(); return;
    }
    let a = pendingFrom, b = id;
    const ca = colIndex[byId[a].col], cb = colIndex[byId[b].col];
    if(ca === cb){ if(a>b){ const t=a; a=b; b=t; } }
    else if(ca > cb){ const t=a; a=b; b=t; }
    const idx = edges.findIndex(e => e[0]===a && e[1]===b);
    if(idx>=0){
      edges.splice(idx,1);
      setEditHint(`Conexión eliminada: <b>${esc(byId[a].name)} → ${esc(byId[b].name)}</b>.`);
    } else {
      edges.push([a,b]);
      setEditHint(`Conexión creada: <b>${esc(byId[a].name)} → ${esc(byId[b].name)}</b> (la primera es previa de la segunda).`);
    }
    pendingFrom = null;
    update();
    saveState();
    return;
  }
  selectedId = (selectedId===id) ? null : id;
  update();
}

function setStatus(id, v){
  if(!v) delete status[id]; else status[id] = v;
  update();
  saveState();
}

function setEdit(on){
  editMode = on;
  pendingFrom = null;
  selectedId = null;
  editHint = on ? 'Elegí dos materias para crear o quitar una conexión entre ellas.' : '';
  document.body.classList.toggle('editing', on);
  $('editLabel').textContent = on ? 'Modo edición: ON' : 'Modo edición: OFF';
  $('editToggle').setAttribute('aria-pressed', String(on));
  update();
}

let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}

function closeMenu(){ $('menu').hidden = true; $('menuBtn').setAttribute('aria-expanded','false'); }
function toggleMenu(){
  const open = $('menu').hidden;
  $('menu').hidden = !open;
  $('menuBtn').setAttribute('aria-expanded', String(open));
}

$('board').addEventListener('click', e => {
  const a = e.target.closest('[data-aca]');
  if(a){ handleAca(a); return; }
  const t = e.target.closest('.tile');
  if(t) onTileClick(Number(t.dataset.id));
});
$('board').addEventListener('input', e => {
  if(e.target.id==='acaName'){
    acaDraft.name = e.target.value;
    const b = $('acaSave'); if(b) b.disabled = !acaDraft.name.trim();
  }
});
$('board').addEventListener('keydown', e => {
  if(e.target.id!=='acaName') return;
  if(e.key==='Enter'){ e.preventDefault(); saveAca(); }
  else if(e.key==='Escape'){ acaFormOpen = false; resetAcaDraft(); renderAca(); const b = document.querySelector('[data-fk="acaopen"]'); if(b) b.focus(); }
});

$('detail').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act;
  if(act==='status' && selectedId!==null) setStatus(selectedId, b.dataset.v);
  else if(act==='go'){
    selectedId = Number(b.dataset.id);
    update();
    const tile = document.querySelector(`.tile[data-id="${selectedId}"]`);
    if(tile && tile.scrollIntoView) tile.scrollIntoView({block:'nearest', behavior:'smooth'});
    const h = $('detail').querySelector('h2'); if(h) h.focus({preventScroll:true});
  }
  else if(act==='exitEdit') setEdit(false);
});

$('cfs').addEventListener('click', e => {
  const b = e.target.closest('.cf[data-campo]');
  if(!b) return;
  campoFilter = (campoFilter===b.dataset.campo) ? '' : b.dataset.campo;
  update();
});

$('flt').addEventListener('click', e => {
  const b = e.target.closest('.fbtn');
  if(!b) return;
  stateFilter = b.dataset.state;
  update();
});

$('menuBtn').addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
document.addEventListener('click', e => { if(!$('menu').hidden && !e.target.closest('.menuwrap')) closeMenu(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('menu').hidden){ closeMenu(); $('menuBtn').focus(); } });

$('editToggle').addEventListener('click', () => { closeMenu(); setEdit(!editMode); });

$('resetBtn').addEventListener('click', () => {
  closeMenu();
  if(confirm('¿Restablecer el mapa a las correlativas validadas? Se perderán tus ediciones actuales.')){
    edges = DRAFT_EDGES.map(e => e.slice());
    pendingFrom = null;
    update();
    saveState();
    toast('Mapa restablecido a las correlativas validadas.');
  }
});

$('clearBtn').addEventListener('click', () => {
  closeMenu();
  if(confirm('¿Vaciar todas las conexiones? Podés reconstruirlas manualmente en modo edición.')){
    edges = [];
    pendingFrom = null;
    update();
    saveState();
    toast('Se vaciaron todas las conexiones.');
  }
});

/* ---------- Tema claro / oscuro ---------- */
function applyTheme(t, persist){
  document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').setAttribute('aria-label', t==='dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
  if(persist){ try{ localStorage.setItem('biotec-theme', t); }catch(e){} }
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light', false);
$('themeBtn').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark', true);
});

/* ---------- Guardado (mismas claves que antes, para conservar tus datos) ---------- */
const STORAGE_KEY = 'state';
const LOCAL_KEY = 'biotec-correlativas-unahur-map';
let storageAvailable = (typeof window.storage !== 'undefined' && window.storage);
let localStorageAvailable = false;
try{
  window.localStorage.setItem('__test__','1');
  window.localStorage.removeItem('__test__');
  localStorageAvailable = true;
}catch(err){ localStorageAvailable = false; }
let saveTimer = null;

function showSaveStatus(kind){
  const el = $('saveStatus');
  el.classList.remove('ok','error');
  if(kind==='ok'){ el.textContent = '● Guardado automáticamente'; el.classList.add('ok'); }
  else if(kind==='ok-local'){ el.textContent = '● Guardado en este navegador'; el.classList.add('ok'); }
  else if(kind==='saving'){ el.textContent = 'Guardando…'; }
  else if(kind==='error'){ el.textContent = '⚠ No se pudo guardar'; el.classList.add('error'); }
  else if(kind==='unavailable'){ el.textContent = 'El guardado automático no está disponible en este navegador. Iniciá sesión para no perder tus cambios.'; }
}

async function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const payload = JSON.stringify({edges, status, aca});
    if(storageAvailable){
      showSaveStatus('saving');
      try{
        await window.storage.set(STORAGE_KEY, payload, false);
        showSaveStatus('ok');
      }catch(err){
        if(localStorageAvailable){
          try{ window.localStorage.setItem(LOCAL_KEY, payload); showSaveStatus('ok-local'); }
          catch(e2){ showSaveStatus('error'); }
        } else showSaveStatus('error');
      }
    } else if(localStorageAvailable){
      try{
        window.localStorage.setItem(LOCAL_KEY, payload);
        showSaveStatus('ok-local');
      }catch(err){ showSaveStatus('error'); }
    } else {
      showSaveStatus('unavailable');
    }
    if(window.cloudPush) window.cloudPush();
  }, 300);
}

async function loadState(){
  if(storageAvailable){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) return JSON.parse(res.value);
    }catch(err){ /* sin guardado previo */ }
  }
  if(localStorageAvailable){
    try{
      const raw = window.localStorage.getItem(LOCAL_KEY);
      if(raw) return JSON.parse(raw);
    }catch(err){ /* sin guardado previo local */ }
  }
  return null;
}

window.getLocalState = () => ({edges, status, aca});
window.applyCloudState = data => {
  edges = data.edges;
  status = (data.status && typeof data.status==='object') ? data.status : {};
  aca = sanitizeAca(data.aca);
  selectedId = null; pendingFrom = null;
  update();
  renderAca();
  try{ if(localStorageAvailable) window.localStorage.setItem(LOCAL_KEY, JSON.stringify({edges, status, aca})); }catch(e){}
};

async function init(){
  buildBoard();
  const saved = await loadState();
  if(saved && Array.isArray(saved.edges)){
    edges = saved.edges;
    status = (saved.status && typeof saved.status==='object') ? saved.status : {};
    aca = sanitizeAca(saved.aca);
    renderAca();
    update();
    toast('Se restauraron tus cambios guardados.');
  } else {
    renderAca();
    update();
    if(!storageAvailable && !localStorageAvailable) showSaveStatus('unavailable');
  }
}

init();
</script>

<script type="module">
/* =====================================================================
   FIREBASE (cuenta + sincronización en la nube)
   Si Firebase no carga, la app sigue funcionando con guardado local.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB35l4kFghRvBV3EaZLL7m06pr6xfSBCOY",
  authDomain: "mapa-biotecnologia.firebaseapp.com",
  projectId: "mapa-biotecnologia",
  storageBucket: "mapa-biotecnologia.firebasestorage.app",
  messagingSenderId: "156610804737",
  appId: "1:156610804737:web:5c8dd4ccb1f66bc8635400"
};

(async () => {
  let A, F, auth, db;
  try {
    const V = '10.14.1';
    const [{ initializeApp }, AA, FF] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
    ]);
    A = AA; F = FF;
    const app = initializeApp(firebaseConfig);
    auth = A.getAuth(app);
    db = F.getFirestore(app);
  } catch (e) {
    console.warn('Firebase no se pudo cargar: la app guarda solo en este navegador.', e);
    return;
  }

  const $ = id => document.getElementById(id);
  const modal = $('authModal'), msg = $('authMsg'), cloud = $('authCloud');

  let user = null;
  let lastSynced = null;
  let pushTimer = null;

  const setCloud = (text, kind) => {
    cloud.textContent = text; cloud.title = text;
    cloud.className = 'sync' + (kind === 'error' ? ' error' : '');
  };
  const setMsg = (text, kind) => { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : ''); };
  const openModal = () => { setMsg(''); modal.classList.add('open'); const g = $('authGoogle'); if (g) g.focus(); };
  const closeModal = () => modal.classList.remove('open');

  const ERRORES = {
    'auth/invalid-credential': 'Email o contraseña incorrectos.',
    'auth/wrong-password': 'Email o contraseña incorrectos.',
    'auth/user-not-found': 'No hay una cuenta con ese email. Probá "Crear cuenta".',
    'auth/email-already-in-use': 'Ese email ya tiene cuenta. Probá "Ingresar".',
    'auth/weak-password': 'La contraseña es muy corta (mínimo 6 caracteres).',
    'auth/invalid-email': 'El email no es válido.',
    'auth/missing-password': 'Escribí tu contraseña.',
    'auth/popup-closed-by-user': 'Cerraste la ventana de Google antes de terminar.',
    'auth/cancelled-popup-request': 'Se canceló el ingreso con Google.',
    'auth/popup-blocked': 'El navegador bloqueó la ventana de Google. Permitila e intentá de nuevo.',
    'auth/unauthorized-domain': 'Este dominio no está autorizado en Firebase (Authentication → Configuración → Dominios autorizados).',
    'auth/operation-not-allowed': 'Ese método de ingreso no está activado en Firebase (Authentication → Sign-in method).',
    'auth/too-many-requests': 'Demasiados intentos. Esperá un rato y probá de nuevo.',
    'auth/network-request-failed': 'Sin conexión. Revisá tu internet.'
  };
  const errText = e => ERRORES[e && e.code] || ('No se pudo completar la acción (' + ((e && e.code) || 'error') + ').');

  const docRef = () => F.doc(db, 'usuarios', user.uid);
  // Forma canónica del estado (los datos viejos sin "aca" se tratan como lista vacía)
  const normalize = d => JSON.stringify({ edges: d.edges, status: d.status || {}, aca: Array.isArray(d.aca) ? d.aca : [] });
  const snapshot = () => normalize(window.getLocalState());

  async function pullOrInit() {
    setCloud('Conectando…');
    try {
      const snap = await F.getDoc(docRef());
      const local = snapshot();
      if (snap.exists() && typeof snap.data().data === 'string') {
        const remote = JSON.parse(snap.data().data);
        if (Array.isArray(remote.edges)) {
          const remoteStr = normalize(remote);
          if (remoteStr !== local) {
            const ls = window.getLocalState();
            const localHasProgress = Object.keys(ls.status).length > 0 || ls.aca.length > 0;
            const useRemote = !localHasProgress ||
              confirm('Este dispositivo tiene cambios distintos a los de tu cuenta.\n\nAceptar = usar los de tu cuenta (se reemplaza lo de acá).\nCancelar = subir lo de este dispositivo y reemplazar lo de tu cuenta.');
            if (useRemote) {
              window.applyCloudState(remote);
              lastSynced = snapshot();
              setCloud('● Sincronizado');
              return;
            }
            await pushNow();
            return;
          }
          lastSynced = remoteStr;
          setCloud('● Sincronizado');
          return;
        }
      }
      await pushNow();
    } catch (e) {
      setCloud('⚠ No se pudo leer tu cuenta (' + ((e && e.code) || 'error') + ')', 'error');
    }
  }

  async function pushNow() {
    if (!user) return;
    const s = snapshot();
    if (s === lastSynced) return;
    try {
      setCloud('Guardando…');
      await F.setDoc(docRef(), { data: s, updatedAt: F.serverTimestamp() });
      lastSynced = s;
      setCloud('● Sincronizado');
    } catch (e) {
      setCloud('⚠ No se pudo guardar en la nube (' + ((e && e.code) || 'error') + ')', 'error');
    }
  }

  window.cloudPush = () => {
    if (!user) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 700);
  };

  A.onAuthStateChanged(auth, async u => {
    user = u;
    if (u) {
      $('authLoginBtn').hidden = true;
      $('authNotice').hidden = true;
      $('authAcct').hidden = false;
      $('authUser').textContent = u.email || 'Cuenta de Google';
      $('menuLogoutWrap').hidden = false;
      closeModal();
      await pullOrInit();
    } else {
      lastSynced = null;
      $('authLoginBtn').hidden = false;
      $('authNotice').hidden = false;
      $('authAcct').hidden = true;
      $('menuLogoutWrap').hidden = true;
      setCloud('');
    }
  });

  $('authLoginBtn').addEventListener('click', openModal);
  $('authNoticeBtn').addEventListener('click', openModal);
  $('authClose').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  $('authLogoutBtn').addEventListener('click', () => { document.getElementById('menu').hidden = true; A.signOut(auth); });

  $('authGoogle').addEventListener('click', async () => {
    setMsg('Abriendo Google…');
    try { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); }
    catch (e) { setMsg(errText(e), 'error'); }
  });
  $('authSignIn').addEventListener('click', async () => {
    setMsg('Ingresando…');
    try { await A.signInWithEmailAndPassword(auth, $('authEmail').value.trim(), $('authPass').value); }
    catch (e) { setMsg(errText(e), 'error'); }
  });
  $('authSignUp').addEventListener('click', async () => {
    setMsg('Creando cuenta…');
    try { await A.createUserWithEmailAndPassword(auth, $('authEmail').value.trim(), $('authPass').value); }
    catch (e) { setMsg(errText(e), 'error'); }
  });
  $('authReset').addEventListener('click', async () => {
    const email = $('authEmail').value.trim();
    if (!email) { setMsg('Escribí tu email arriba y volvé a tocar "Olvidé mi contraseña".', 'error'); return; }
    try { await A.sendPasswordResetEmail(auth, email); setMsg('Te enviamos un mail para restablecer la contraseña.', 'ok'); }
    catch (e) { setMsg(errText(e), 'error'); }
  });
})();
</script>
